<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Pranav Paradkar — Web, Machine Learning, and DevOps</title>
  <desc id="desc">A warm ivory and charcoal editorial banner. Pranav Paradkar appears in large stacked type on the left, with an amber and coral double-P monogram on the right.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
    <linearGradient id="charcoal" x1="740" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292822"/><stop offset="1" stop-color="#171b19"/>
    </linearGradient>
    <linearGradient id="amber" x1="830" y1="90" x2="970" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd384"/><stop offset="1" stop-color="#efad47"/>
    </linearGradient>
    <linearGradient id="coral" x1="910" y1="130" x2="1060" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f48d6d"/><stop offset="1" stop-color="#db654d"/>
    </linearGradient>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#f4f0e7"/>
    <circle cx="63" cy="-145" r="300" fill="#efad47" opacity="0.07"/>
    <path d="M767 0H1200V380H658Z" fill="url(#charcoal)"/>
    <path d="M748 0L639 380" stroke="#df7858" stroke-width="2" opacity="0.65"/>

    <rect x="55" y="37" width="7" height="7" rx="1" fill="#c36940"/>
    <text x="76" y="45" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="600" letter-spacing="2.2" fill="#68665e">PRANAVP2207 / DEVELOPER</text>

    <text x="51" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="#222822">Pranav</text>
    <text x="52" y="232" font-family="Georgia,Times New Roman,serif" font-size="94" font-style="italic" letter-spacing="-3" fill="#222822">Paradkar</text>
    <circle cx="428" cy="225" r="7" fill="#d87652"/>
    <text x="56" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#68665e">From technical ideas to useful applications.</text>

    <path d="M56 292H607" stroke="#d7d0c3"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.5" fill="#444b42" text-anchor="middle">
      <rect x="56" y="312" width="172" height="33" rx="16.5" fill="none" stroke="#cfc8ba"/>
      <text x="142" y="333">WEB DEVELOPMENT</text>
      <rect x="240" y="312" width="178" height="33" rx="16.5" fill="none" stroke="#cfc8ba"/>
      <text x="329" y="333">MACHINE LEARNING</text>
      <rect x="430" y="312" width="102" height="33" rx="16.5" fill="#e8ddc7"/>
      <text x="481" y="333">DEVOPS</text>
    </g>

    <text x="1150" y="44" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="2" fill="#b8ad91">IDEAS → APPLICATIONS</text>
    <circle cx="950" cy="198" r="131" fill="none" stroke="#e9c27a" stroke-opacity="0.13"/>
    <circle cx="950" cy="198" r="146" fill="none" stroke="#e9c27a" stroke-opacity="0.05"/>
    <path d="M819 198H1081M950 67V329" stroke="#e9c27a" stroke-opacity="0.07"/>
    <g class="motion" aria-hidden="true">
      <g>
        <path d="M950 52A146 146 0 0 1 1096 198" fill="none" stroke="#f0b961" stroke-opacity="0.55" stroke-width="1.3"/>
        <circle cx="1096" cy="198" r="3" fill="#f0b961"/>
        <animateTransform attributeName="transform" type="rotate" from="0 950 198" to="360 950 198" dur="32s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M834 91H902C985 91 985 194 902 194H863V275H834ZM863 120V165H902C945 165 945 120 902 120Z" fill="url(#amber)" fill-rule="evenodd"/>
    <path d="M922 135H990C1073 135 1073 238 990 238H951V319H922ZM951 164V209H990C1033 209 1033 164 990 164Z" fill="url(#coral)" fill-rule="evenodd"/>

    <path d="M790 350H841" stroke="#a09175" stroke-opacity="0.5"/>
    <text x="861" y="354" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="2.2" fill="#c5b89b">BUILD. LEARN. SHIP.</text>
  </g>
</svg>
