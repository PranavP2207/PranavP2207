<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Pranav Paradkar — web, machine learning, devops</title>
  <desc id="desc">A maroon terminal landscape with seven nested burgundy contours. The prompt reads ~/pranav $ whoami above Pranav Paradkar. A rose cursor and a small summit marker provide two accents.</desc>
